<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rynn Panel</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="header">
<img src="rynn-icon.svg" alt="Rynn" class="logo">
<div>
<h1>Rynn Panel</h1>
<p>Panel lokal, hanya di perangkat ini.</p>
</div>
</header>
<main class="grid">
<section class="card" id="status">
<div class="skeleton"></div>
</section>
<section class="card">
<h2>Perintah teratas</h2>
<ul id="perintah" class="list"><li class="skeleton"></li></ul>
</section>
<section class="card">
<h2>Tentang</h2>
<p>Panel memakai warna dan ikon dari identitas Rynn. Animasi bisa dimatikan lewat preferensi sistem.</p>
</section>
</main>
<script src="app.js"></script>
</body>
</html>
